name: Build and release Windows portable app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.11

      - name: Stamp build version
        shell: pwsh
        run: |
          $version = "$((Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')).${{ github.run_number }}"
          echo "BUILD_VERSION=$version" >> $env:GITHUB_ENV
          Set-Content -Path appversion.py -Value "COMMIT_SHA = `"${{ github.sha }}`""
          Add-Content -Path appversion.py -Value "BUILD_VERSION = `"$version`""

      - name: Assemble portable app folder
        shell: pwsh
        run: |
          # uv sync가 만드는 .venv\Scripts\python.exe는 "trampoline"이라 uv가 관리하는
          # 캐시 경로를 참조함 - 다른 PC로 폴더만 복사하면 그 경로가 없어서 깨짐
          # ("uv trampoline ... entity not found"). 그래서 venv가 아니라 uv가 내려받은
          # 진짜 standalone CPython(python-build-standalone, 재배치 가능하게 만들어진 것)을
          # 그대로 복사해서 그 안에 pip로 패키지를 직접 설치함.
          $pythonLine = (uv python list --only-installed) | Where-Object { $_ -match 'cpython-3\.11\.\d+-windows-x86_64-none' } | Select-Object -First 1
          $pythonExe = ($pythonLine -split '\s+')[-1]
          $pythonSrcRoot = Split-Path $pythonExe -Parent
          Write-Host "Standalone python source: $pythonSrcRoot"

          $appDir = "dist\TrainingDataExtractor"
          New-Item -ItemType Directory -Force -Path "$appDir\app" | Out-Null
          Copy-Item $pythonSrcRoot "$appDir\python" -Recurse

          uv export --format requirements.txt --no-hashes -o requirements.txt
          uv pip install --python "$appDir\python\python.exe" --system --break-system-packages -r requirements.txt

          Get-ChildItem -Filter *.py | Where-Object { $_.Name -notlike "test_*" } | Copy-Item -Destination "$appDir\app"
          Copy-Item trainer "$appDir\app\trainer" -Recurse
          $runBat = "@echo off`r`nstart `"`" `"%~dp0python\pythonw.exe`" `"%~dp0app\main.py`""
          Set-Content -Path "$appDir\Run.bat" -Value $runBat -Encoding ASCII
          Compress-Archive -Path $appDir -DestinationPath dist\TrainingDataExtractor.zip

      - name: Write version manifest
        shell: pwsh
        run: |
          $manifest = @{ sha = "${{ github.sha }}"; version = "${{ env.BUILD_VERSION }}" } | ConvertTo-Json -Compress
          Set-Content -Path dist\version.json -Value $manifest

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "${{ env.BUILD_VERSION }} (${{ github.sha }})"
          body: |
            자동 빌드됨. 버전: ${{ env.BUILD_VERSION }} / 커밋: ${{ github.sha }}
            받은 뒤 압축을 풀고 TrainingDataExtractor 폴더 안의 Run.bat을 실행하세요.
            GPU(cu126 torch)는 처음 GPU 옵션으로 추론/학습을 돌릴 때 그 PC에서 한 번만
            자동으로 받습니다(설치 후 앱 재시작 필요) - exe에 CUDA를 통째로 넣지 않아
            2GB 릴리스 제한을 피함.
            항상 이 링크가 최신 버전을 가리킵니다:
            https://github.com/${{ github.repository }}/releases/latest/download/TrainingDataExtractor.zip
          files: |
            dist/TrainingDataExtractor.zip
            dist/version.json
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
